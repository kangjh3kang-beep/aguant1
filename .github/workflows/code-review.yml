name: Antigravity Code Review Agent

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: "[Stage 1/3] Compile Check"
        run: npm run build

      - name: "[Stage 2/3] Lint Check"
        run: npm run lint

      - name: "[Stage 3/3] Test with Coverage"
        run: npm test

      - name: Upload coverage report
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  review-report:
    name: Generate Review Report
    needs: code-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full code review
        run: npx ts-node src/cli.ts review --json > review-report.json
        continue-on-error: true

      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: review-report.json
          retention-days: 30
